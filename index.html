<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現貨庫存盤點</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-5">
    <h1 class="text-xl font-bold text-center text-slate-800 mb-4">📦 現貨盤點工具</h1>
    
    <!-- 掃碼鏡頭區域 -->
    <div id="reader" class="w-full rounded-lg overflow-hidden bg-black mb-4 min-h-[200px]"></div>

    <form id="stockForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">JAN Code (條碼)</label>
        <div class="flex gap-2">
          <input type="text" id="janCode" required class="w-full border rounded-lg p-2.5 bg-slate-50 text-lg font-mono focus:ring-2 focus:ring-blue-500" placeholder="掃碼或手動輸入">
          <button type="button" onclick="startScanner()" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-sm font-medium">重掃</button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">現貨數量</label>
        <input type="number" id="quantity" value="1" min="1" required class="w-full border rounded-lg p-2.5 text-lg font-bold text-center">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">拍攝商品照片</label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" class="w-full border rounded-lg p-2 bg-slate-50 text-sm">
        <img id="preview" class="hidden mt-2 w-full h-40 object-cover rounded-lg border">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow transition">
        儲存並記錄去 Sheets
      </button>
    </form>
  </div>

  <script>
  // ⚠️ 請記得替換為你喺 Apps Script 複製嘅 Web App URL
  const GOOGLE_SCRIPT_URL = '填入你的_GOOGLE_APPS_SCRIPT_URL';

  let html5QrCode;

  function startScanner() {
    // 如果已經初始化過，先停止
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => initCamera()).catch(err => console.error(err));
    } else {
      initCamera();
    }
  }

  function initCamera() {
    html5QrCode = new Html5Qrcode("reader");
    
    // 強制指定使用 iPhone 的後置鏡頭 (environment)
    const config = { fps: 10, qrbox: { width: 250, height: 150 } };
    
    html5QrCode.start(
      { facingMode: "environment" }, 
      config,
      (decodedText) => {
        // 掃碼成功
        document.getElementById('janCode').value = decodedText;
        navigator.vibrate?.(100);
        html5QrCode.stop(); // 掃完自動暫停鏡頭
      },
      (errorMessage) => {
        // 掃描中，忽略尋找條碼的過程錯誤
      }
    ).catch(err => {
      console.error("相機開啟失敗:", err);
      alert("無法開啟相機，請確認已允許 Safari 相機權限，或嘗試點擊「重掃」。");
    });
  }

  // 圖片預覽與轉 Base64
  let base64Photo = "";
  document.getElementById('photoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const max_size = 800;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > max_size) { height *= max_size / width; width = max_size; }
          } else {
            if (height > max_size) { width *= max_size / height; height = max_size; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          base64Photo = canvas.toDataURL('image/jpeg', 0.7);
          
          const preview = document.getElementById('preview');
          preview.src = base64Photo;
          preview.classList.remove('hidden');
        }
      };
      reader.readAsDataURL(file);
    }
  });

  // 表單提交
  document.getElementById('stockForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = '上傳中...';

    const payload = {
      janCode: document.getElementById('janCode').value,
      quantity: document.getElementById('quantity').value,
      photo: base64Photo
    };

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      alert('成功記錄！');
      document.getElementById('janCode').value = '';
      document.getElementById('quantity').value = '1';
      document.getElementById('photoInput').value = '';
      document.getElementById('preview').classList.add('hidden');
      base64Photo = "";
      startScanner(); // 重新開啟掃描器
    } catch (err) {
      alert('儲存失敗：' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = '儲存並記錄去 Sheets';
    }
  });

  window.onload = startScanner;
</script>
</body>
</html>
